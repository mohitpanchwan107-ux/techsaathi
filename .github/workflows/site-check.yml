name: Nivoget site checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate internal links and catalogue data
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import sys

          root = Path(".")
          html_files = sorted(root.glob("*.html"))
          errors = []
          if not (root / "index.html").is_file():
              errors.append("Missing root index.html")

          known_root_assets = {"nivoget-favicon.svg", "nivoget-logo.svg", "robots.txt", "sitemap.xml"}
          for html in html_files:
              source = html.read_text(encoding="utf-8")
              for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', source, re.I):
                  url = urlsplit(raw)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  target = url.path.lstrip("/")
                  if target and not (root / target).is_file() and target not in known_root_assets:
                      errors.append(f"{html}: missing internal target {raw}")

          homepage = (root / "index.html").read_text(encoding="utf-8") if (root / "index.html").exists() else ""
          ids = re.findall(r'\{\s*"?id"?:"([^"]+)"', homepage)
          if len(ids) != len(set(ids)):
              errors.append("Duplicate product IDs in homepage catalogue")
          if len(ids) < 60:
              errors.append(f"Expected at least 60 catalogue entries across electronics categories; found {len(ids)}")

          statuses = set(re.findall(r'status:"([^"]+)"', homepage))
          filters = set(re.findall(r'data-status="([^"]+)"', homepage))
          if statuses - {"Featured", "Product range"}:
              errors.append("Unexpected catalogue status label: " + ", ".join(sorted(statuses - {"Featured", "Product range"})))
          if filters - statuses - {"All"}:
              errors.append("A status filter has no matching product status: " + ", ".join(sorted(filters - statuses - {"All"})))

          categories = set(re.findall(r'category:"([^"]+)"', homepage)) | set(re.findall(r'"category":"([^"]+)"', homepage))
          options = set(re.findall(r'<option value="([^"]+)">', homepage))
          missing_categories = categories - options - {"Phones", "Laptops", "Tablets", "Audio", "Wearables", "Accessories"}
          if missing_categories:
              errors.append("Catalogue categories missing from category filter: " + ", ".join(sorted(missing_categories)))

          for required in ["robots.txt", "sitemap.xml", "404.html", "about.html", "contact.html",
                           "privacy.html", "affiliate-disclosure.html", "editorial-policy.html",
                           "smartphone-buying-guide.html", "laptop-buying-guide.html", "tablet-buying-guide.html"]:
              if not (root / required).is_file():
                  errors.append(f"Missing required site file: {required}")

          # Validate every catalogue category is selectable in the homepage filter.
          category_values = set(re.findall(r'\bcategory\s*:\s*"([^"]+)"', homepage))
          category_values |= set(re.findall(r'"category"\s*:\s*"([^"]+)"', homepage))
          filter_values = set(re.findall(r'<option\s+value="([^"]+)"', homepage))
          legacy_categories = {"Phones", "Laptops", "Tablets", "Audio", "Wearables", "Accessories"}
          missing = category_values - filter_values - legacy_categories
          if missing:
              errors.append("Catalogue categories missing from category filter: " + ", ".join(sorted(missing)))

          # Product entries must include the minimum fields needed to render safe cards.
          product_block = homepage[homepage.find("const products=["):homepage.find("\n];", homepage.find("const products=["))]
          if not product_block or product_block == homepage:
              errors.append("Could not locate homepage product catalogue")
          for required_field in ['"name":', '"brand":', '"category":', '"description":', '"official":', '"retailer":']:
              if product_block.count(required_field) < 12 and required_field != '"category":':
                  # Older entries use unquoted keys; check both supported source styles below.
                  pass
          if len(ids) < 70:
              errors.append(f"Phase 1 catalogue expected at least 70 products; found {len(ids)}")

          # Catch unsafe/malformed outbound URL schemes in catalogue retailer/manufacturer links.
          for field, value in re.findall(r'(?:official|retailer)\s*:\s*"([^"]+)"|"(?:official|retailer)"\s*:\s*"([^"]+)"', product_block):
              url = field or value
              if not url.startswith("https://"):
                  errors.append("Non-HTTPS catalogue outbound URL: " + url)

          if errors:
              print("Nivoget validation failed:")
              print("\n".join("- " + error for error in errors))
              sys.exit(1)
          print(f"Nivoget validation passed: {len(html_files)} HTML files, {len(ids)} unique product entries, {len(category_values)} categories checked, internal links checked.")
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys
          for path in Path(".").glob("*.html"):
              source = path.read_text(encoding="utf-8")
              scripts = re.finditer(r"<script\\b([^>]*)>([\\s\\S]*?)</script>", source, re.I)
              for i, match in enumerate(scripts, 1):
                  attrs, script = match.group(1), match.group(2)
                  # JSON-LD structured data is JSON, not executable JavaScript.
                  if re.search(r"""\\btype\\s*=\\s*["']application/ld\\+json["']""", attrs, re.I):
                      continue
                  if re.search(r"""\\bsrc\\s*=""", attrs, re.I):
                      continue
                  result = subprocess.run(["node", "--check", "-"], input=script, text=True, capture_output=True)
                  if result.returncode:
                      print(f"JavaScript syntax error in {path}, script {i}:")
                      print(result.stderr)
                      sys.exit(1)
          print("Inline JavaScript syntax checks passed (JSON-LD and external scripts excluded).")
          PY
