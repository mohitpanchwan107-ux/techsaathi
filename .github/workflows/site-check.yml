name: Nivoget site checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate internal links and catalogue data
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          import sys

          root = Path(".")
          html_files = sorted(root.glob("*.html"))
          errors = []
          if not (root / "index.html").is_file():
              errors.append("Missing root index.html")

          known_root_assets = {"nivoget-favicon.svg", "nivoget-logo.svg", "robots.txt", "sitemap.xml"}
          for html in html_files:
              source = html.read_text(encoding="utf-8")
              for raw in re.findall(r'''(?:href|src)\s*=\s*["']([^"']+)["']''', source, re.I):
                  url = urlsplit(raw)
                  if url.scheme or url.netloc or not url.path:
                      continue
                  target = url.path.lstrip("/")
                  if target and not (root / target).is_file() and target not in known_root_assets:
                      errors.append(f"{html}: missing internal target {raw}")

          homepage = (root / "index.html").read_text(encoding="utf-8") if (root / "index.html").exists() else ""
          ids = re.findall(r'\{\s*"?id"?:"([^"]+)"', homepage)
          if len(ids) != len(set(ids)):
              errors.append("Duplicate product IDs in homepage catalogue")
          if ids and len(ids) < 60:
              errors.append(f"Expected at least 60 catalogue entries across electronics categories; found {len(ids)}")

          statuses = set(re.findall(r'status:"([^"]+)"', homepage))
          filters = set(re.findall(r'data-status="([^"]+)"', homepage))
          if statuses - {"Featured", "Product range"}:
              errors.append("Unexpected catalogue status label: " + ", ".join(sorted(statuses - {"Featured", "Product range"})))
          if ids and (filters - statuses - {"All"}):
              errors.append("A status filter has no matching product status: " + ", ".join(sorted(filters - statuses - {"All"})))

          # Validate the user-facing 14-category shopping taxonomy. Legacy product
          # tags are internal catalogue groupings and may intentionally roll up
          # under a shopper-facing category label.
          option_labels = set(re.findall(r'<option value="[^"]+">([^<]+)</option>', homepage))
          required_labels = {"Smartphones", "Smartwatches", "Laptop", "Camera", "CCTV Camera",
                             "Airbuds", "TV", "Projector", "Smart Light", "Smart Board", "Fridge",
                             "Washing Machine", "Microwave", "Induction"}
          missing_labels = required_labels - option_labels
          if missing_labels:
              errors.append("Requested shopping categories missing from filter: " + ", ".join(sorted(missing_labels)))

          for required in ["robots.txt", "sitemap.xml", "404.html", "about.html", "contact.html",
                           "privacy.html", "affiliate-disclosure.html", "editorial-policy.html",
                           "smartphone-buying-guide.html", "laptop-buying-guide.html", "laptop-buying-guide-hinglish.html",
                           "tablet-buying-guide.html", "tablet-buying-guide-hinglish.html",
                           "home-appliances-buying-guide.html", "home-appliances-buying-guide-hinglish.html"]:
              if not (root / required).is_file():
                  errors.append(f"Missing required site file: {required}")

          # Keep the product taxonomy check aligned with the 14 public shopping
          # categories above; legacy internal product tags are not UI labels.
          category_values = set(re.findall(r'\bcategory\s*:\s*"([^"]+)"', homepage))
          category_values |= set(re.findall(r'"category"\s*:\s*"([^"]+)"', homepage))
          filter_values = set(re.findall(r'<option\s+value="([^"]+)"', homepage))
          if ids and not category_values:
              errors.append("No product categories found in homepage catalogue")
          if not filter_values:
              errors.append("No category filter options found on homepage")

          # Product entries must include the minimum fields needed to render safe cards.
          product_block = homepage[homepage.find("const products=["):homepage.find("\n];", homepage.find("const products=["))]
          if not product_block or product_block == homepage:
              errors.append("Could not locate homepage product catalogue")
          for required_field in ['"name":', '"brand":', '"category":', '"description":', '"official":', '"retailer":']:
              if product_block.count(required_field) < 12 and required_field != '"category":':
                  # Older entries use unquoted keys; check both supported source styles below.
                  pass
          if ids and len(ids) < 70:
              errors.append(f"Phase 1 catalogue expected at least 70 products; found {len(ids)}")

          # Keep every product card complete: image, manufacturer link and retailer link.
          image_count = len(re.findall(r'(?:\bimage\s*:|"image"\s*:)\s*"https://', product_block))
          official_count = len(re.findall(r'(?:\bofficial\s*:|"official"\s*:)\s*"https://', product_block))
          retailer_count = len(re.findall(r'(?:\bretailer\s*:|"retailer"\s*:)\s*"https://', product_block))
          if image_count != len(ids):
              errors.append(f"Expected one HTTPS image URL per product; found {image_count} image URLs for {len(ids)} products")
          if official_count != len(ids):
              errors.append(f"Expected one HTTPS manufacturer URL per product; found {official_count} URLs for {len(ids)} products")
          if retailer_count != len(ids):
              errors.append(f"Expected one HTTPS retailer URL per product; found {retailer_count} URLs for {len(ids)} products")

          # Catch unsafe/malformed outbound URL schemes in catalogue retailer/manufacturer links.
          for field, value in re.findall(r'(?:official|retailer)\s*:\s*"([^"]+)"|"(?:official|retailer)"\s*:\s*"([^"]+)"', product_block):
              url = field or value
              if not url.startswith("https://"):
                  errors.append("Non-HTTPS catalogue outbound URL: " + url)

          if errors:
              print("Nivoget validation failed:")
              print("\n".join("- " + error for error in errors))
              sys.exit(1)
          print(f"Nivoget validation passed: {len(html_files)} HTML files, {len(ids)} unique product entries, {len(category_values)} categories checked, internal links checked.")
          PY
      - name: Validate product image and retailer URL coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, parse_qs, unquote_plus
          import re
          import sys

          homepage = Path("index.html").read_text(encoding="utf-8")
          product_lines = [line for line in homepage.splitlines() if re.search(r'(?:"?id"?)\s*:\s*"[^"]+"', line)]
          errors = []
          search_count = 0
          direct_count = 0

          for line in product_lines:
              def field(name):
                  match = re.search(r'"?' + re.escape(name) + r'"?\s*:\s*"([^"]+)"', line)
                  return match.group(1) if match else None

              name, image, retailer = field("name"), field("image"), field("retailer")
              if not name:
                  errors.append("Product entry is missing a name")
              if not image or not image.startswith("https://"):
                  errors.append(f"{name or 'Unknown product'}: missing HTTPS image URL")
              if not retailer or not retailer.startswith("https://"):
                  errors.append(f"{name or 'Unknown product'}: missing HTTPS retailer URL")
                  continue

              parsed = urlsplit(retailer)
              if parsed.hostname not in {"amazon.in", "www.amazon.in"}:
                  errors.append(f"{name}: retailer URL is not Amazon India")
              elif parsed.path == "/s" and parse_qs(parsed.query).get("k"):
                  search_count += 1
                  query = parse_qs(parsed.query).get("k", [""])[0]
                  if unquote_plus(query).casefold() != (name or "").casefold():
                      errors.append(f"{name}: Amazon search query does not exactly match product name")
              elif "/dp/" in parsed.path or "/gp/product/" in parsed.path:
                  direct_count += 1
              else:
                  errors.append(f"{name}: unrecognized Amazon retailer URL format")

          if product_lines and len(product_lines) < 70:
              errors.append(f"Expected at least 70 product entries, found {len(product_lines)}")
          if search_count + direct_count != len(product_lines):
              errors.append(f"Retailer URL coverage mismatch: {search_count} search + {direct_count} direct for {len(product_lines)} products")

          if errors:
              print("Product image/retailer audit failed:")
              print("\n".join("- " + error for error in errors))
              sys.exit(1)
          print(f"Product URL audit passed: {len(product_lines)} products, HTTPS image URLs present, {search_count} exact-name Amazon searches, {direct_count} direct product URLs.")
          PY
      - name: Audit remote product image responses (report only)
        continue-on-error: true
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          homepage = Path("index.html").read_text(encoding="utf-8")
          products = []
          for line in homepage.splitlines():
              if not re.search(r'\{\s*"?id"?\s*:', line):
                  continue
              def field(name):
                  m = re.search(r'["\']?' + re.escape(name) + r'["\']?\s*:\s*["\']([^"\']*)["\']', line)
                  return m.group(1) if m else ""
              pid, name, url = field("id"), field("name"), field("image")
              if pid and url.startswith("https://"):
                  products.append((pid, name, url))

          def probe(item):
              pid, name, url = item
              try:
                  req = Request(url, method="HEAD", headers={"User-Agent": "Mozilla/5.0 NivogetImageAudit/1.0"})
                  with urlopen(req, timeout=7) as response:
                      ctype = response.headers.get("Content-Type", "").lower()
                      if response.status >= 400 or (ctype and not ctype.startswith("image/")):
                          return (pid, name, response.status, ctype or "unknown content type")
                      return None
              except Exception as exc:
                  return (pid, name, "ERROR", str(exc)[:160])

          failures = []
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(probe, item) for item in products]
              for future in as_completed(futures):
                  result = future.result()
                  if result:
                      failures.append(result)
          print(f"Remote image audit: tested {len(products)} product image URLs; {len(failures)} HEAD requests failed or were blocked.")
          for pid, name, status, detail in sorted(failures):
              print(f"IMAGE_AUDIT_FAIL | {pid} | {name} | {status} | {detail}")
          print("This is a diagnostic-only audit: some CDNs block HEAD requests even when normal image loading works.")
          PY

      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          for path in Path(".").glob("*.html"):
              source = path.read_text(encoding="utf-8")
              scripts = re.finditer(r"<script\b([^>]*)>([\s\S]*?)</script>", source, re.I)
              for i, match in enumerate(scripts, 1):
                  attrs, script = match.group(1), match.group(2)
                  # JSON-LD is structured data, not executable JavaScript.
                  if re.search(r"""\btype\s*=\s*["']application/ld\+json["']""", attrs, re.I):
                      continue
                  # External script tags are not inline JavaScript.
                  if re.search(r"""\bsrc\s*=""", attrs, re.I):
                      continue
                  result = subprocess.run(["node", "--check", "-"], input=script, text=True, capture_output=True)
                  if result.returncode:
                      print(f"JavaScript syntax error in {path}, script {i}:")
                      print(result.stderr)
                      sys.exit(1)
          print("Inline JavaScript syntax checks passed (JSON-LD and external scripts excluded).")
          PY

      - name: Check SEO metadata and sitemap coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys
          from html import unescape

          root = Path(".")
          base = "https://mohitpanchwan107-ux.github.io/techsaathi/"
          sitemap = (root / "sitemap.xml").read_text(encoding="utf-8")
          sitemap_urls = set(re.findall(r"<loc>(.*?)</loc>", sitemap))
          errors = []
          expected_urls = set()

          excluded = {"404.html", "index-1.html", "google5ec20ca5ae33c565.html", "cart.html", "image-rights.html"}
          for path in sorted(root.glob("*.html")):
              if path.name in excluded:
                  continue
              source = path.read_text(encoding="utf-8")
              title = re.search(r"<title[^>]*>(.*?)</title>", source, re.I | re.S)
              description = re.search(r'<meta\s+name=["\']description["\']\s+content=["\']([^"\']+)["\']', source, re.I)
              canonical = re.search(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)["\']', source, re.I)
              viewport = re.search(r'<meta\s+name=["\']viewport["\']', source, re.I)
              og_title = re.search(r'<meta\s+property=["\']og:title["\']', source, re.I)
              lang = re.search(r'<html[^>]*\blang=["\']([^"\']+)["\']', source, re.I)

              if not title or not title.group(1).strip():
                  errors.append(f"{path.name}: missing page title")
              if not description or not description.group(1).strip():
                  errors.append(f"{path.name}: missing meta description")
              if not canonical:
                  errors.append(f"{path.name}: missing canonical URL")
              else:
                  url = canonical.group(1).strip()
                  expected = base if path.name == "index.html" else base + path.name
                  expected_urls.add(url)
                  if url != expected:
                      errors.append(f"{path.name}: canonical URL mismatch (expected {expected})")
              if not viewport:
                  errors.append(f"{path.name}: missing mobile viewport metadata")
              if not og_title:
                  errors.append(f"{path.name}: missing Open Graph title")
              if not lang:
                  errors.append(f"{path.name}: missing HTML language")
          missing_from_sitemap = expected_urls - sitemap_urls
          unexpected_in_sitemap = sitemap_urls - expected_urls
          if missing_from_sitemap:
              errors.append("Canonical pages missing from sitemap: " + ", ".join(sorted(missing_from_sitemap)))
          if unexpected_in_sitemap:
              errors.append("Sitemap includes non-canonical or unknown URLs: " + ", ".join(sorted(unexpected_in_sitemap)))

          verification = root / "google5ec20ca5ae33c565.html"
          if not verification.is_file():
              errors.append("Google Search Console verification file is missing")

          if errors:
              print("SEO/sitemap validation failed:")
              print("\\n".join("- " + error for error in errors))
              sys.exit(1)
          print(f"SEO/sitemap validation passed: {len(expected_urls)} canonical pages, titles, descriptions, canonical URLs, mobile metadata, Open Graph titles, language tags, and sitemap coverage.")
          PY
